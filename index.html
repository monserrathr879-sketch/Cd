<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Te extraño</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: #000 url('Screenshot_2026-05-06-17-40-07-171_com.pinterest.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            overflow: hidden;
            cursor: pointer;
        }

        .contenedor {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: rgba(0, 0, 50, 0.5);
        }

        .texto {
            font-size: 1.5rem;
            line-height: 1.8;
            text-align: center;
            text-shadow: 2px 2px 4px black;
            max-width: 800px;
        }
    </style>
</head>
<body>

    <!-- AQUÍ CARGAMOS EL AUDIO -->
    <audio id="musica" loop>
        <source src="tu-musica.mp3" type="audio/mpeg">
    

    <div class="contenedor">
        <div class="texto" id="texto">
            <!-- AQUÍ VA A APARECER EL TEXTO -->
        </div>
    </div>

    <script>
        // El mensaje completo
        const mensaje = `Te extraño, pero no te quiero devuelta suena absurdo pero es la verdad que más me duele aceptar, extraño tu risa, la forma en que mi nombre sonaba distinto cuando lo decías la manera en que tus ojos me hacían sentir en casa, extraño lo que fuimos o lo que creímos ser.

Pero no extraño las noches sintiéndome solo a tu lado, no extraño las dudas, ni el silencio que gritaba más que nosotros...

No extraño la versión de mí que se rompió intentando que esto funcionara te extraño porque fuiste parte de mi vida, porque hay recuerdos que se quedan tatuados en el alma...

Pero volver significaría perderme otra vez, y esta vez elegí quedarme conmigo, ojalá encuentres lo que conmigo no pudiste, ojalá alguien te ame sin miedo y tú sepas quedarte, yo aprenderé a recordarte sin llorarte, adiós que la vida te cuide, como tú no supiste cuidarme`;

        const elementoTexto = document.getElementById('texto');
        const musica = document.getElementById('musica');
        let indice = 0;
        let pausa = false;

        // Función para escribir letra por letra
        function escribir() {
            if (!pausa && indice < mensaje.length) {
                elementoTexto.innerHTML += mensaje.charAt(indice);
                indice++;
                setTimeout(escribir, 100); // Velocidad lenta
            }
        }

        // INICIAR TEXTO Y MÚSICA
        function iniciar() {
            escribir();
            musica.play(); // Suena la música
        }

        // PAUSAR Y SEGUIR TODO AL DAR CLIC
        document.body.addEventListener('click', function() {
            pausa = !pausa;
            if (!pausa) {
                escribir();
                musica.play();
            } else {
                musica.pause();
            }
        });

        // Empezar todo apenas cargue
        window.onload = iniciar;

    </script>

</body>
</html>
